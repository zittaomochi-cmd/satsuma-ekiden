<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>タスキ端末の設定</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
  :root { --bg: #f4f2ec; --surface: #fff; --ink: #1b1d22; --muted: #6a6f78; --line: #e2ded4; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #111418; --surface: #1a1e24; --ink: #eef0f3; --muted: #9aa1ab; --line: #2a3038; color-scheme: dark; } }
  :root[data-theme="dark"] { --bg: #111418; --surface: #1a1e24; --ink: #eef0f3; --muted: #9aa1ab; --line: #2a3038; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif; padding: 20px 16px 40px; }
  main { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 6px; }
  p { color: var(--muted); line-height: 1.7; margin: 0 0 14px; font-size: .9rem; }
  label { display: block; font-weight: 700; margin: 18px 0 6px; }
  input { width: 100%; font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
  input[type="checkbox"] { width: auto; margin-right: 6px; }
  .opts { display: flex; gap: 16px; margin-top: 10px; font-size: .9rem; }
  .opts label { display: inline; font-weight: 500; margin: 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; margin-top: 20px; }
  .card { background: #fff; color: #1b1d22; border-radius: 12px; padding: 14px; text-align: center; border-top: 10px solid var(--c); break-inside: avoid; }
  .card b { display: block; font-size: 1.05rem; }
  .card small { color: #6a6f78; }
  .card svg { width: 100%; height: auto; margin-top: 8px; }
  .card a { font-size: .7rem; word-break: break-all; color: #6a6f78; }
  .viewer { border-top-color: #0f2a4a; }
  button { font: inherit; padding: 10px 16px; border-radius: 8px; border: 0; background: #0f2a4a; color: #fff; font-weight: 700; margin-top: 16px; cursor: pointer; }
  @media print { body { background: #fff; padding: 0; } .noprint { display: none; } .card { border: 1px solid #ccc; border-top: 10px solid var(--c); } }
</style>
</head>
<body>
<main>
  <div class="noprint">
    <h1>タスキ端末の設定</h1>
    <p>各チームのタスキに付けるスマホで、下のQRコードを読み取って開きます。<br>
    QRコードには送信用の鍵が入るので、<b>印刷したら関係者以外に見せないで</b>ください。鍵はこのページの外には送られません。</p>
    <label for="key">送信用の鍵（Firebase のデータベースシークレット）</label>
    <input id="key" autocomplete="off" spellcheck="false" placeholder="README の手順で取得した文字列">
    <div class="opts"><label><input type="checkbox" id="test"> 試走モード（大会時刻を待たずに距離を数える）</label></div>
    <button type="button" onclick="print()">印刷する</button>
  </div>
  <div class="grid" id="grid"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script type="module">
  import { TEAMS } from './js/teams.js';
  const base = new URL('.', location.href).href;
  const qr = text => { const q = qrcode(0, 'M'); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 4, margin: 2, scalable: true }); };
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  function draw() {
    const key = document.getElementById('key').value.trim();
    const test = document.getElementById('test').checked;
    const cards = TEAMS.map(t => {
      const url = `${base}runner.html?team=${t.id}&key=${encodeURIComponent(key)}${test ? '&test=1' : ''}`;
      return `<div class="card" style="--c:${t.color === '#ffffff' ? '#cfcfcf' : t.color}"><b>${t.name}</b><small>タスキ：${t.tasuki}</small>${qr(url)}</div>`;
    });
    cards.push(`<div class="card viewer" style="--c:#0f2a4a"><b>観戦ページ</b><small>みんなに配るURL</small>${qr(base)}<a href="${esc(base)}">${esc(base)}</a></div>`);
    document.getElementById('grid').innerHTML = cards.join('');
  }
  document.getElementById('key').addEventListener('input', draw);
  document.getElementById('test').addEventListener('change', draw);
  draw();
</script>
</body>
</html>
