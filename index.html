<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>さつま町駅伝ライブ</title>
<meta name="description" content="第22回さつま町駅伝競走大会の各チームの現在位置と順位をリアルタイムで表示します。">
<meta name="theme-color" content="#0f2a4a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>さつま町駅伝 <span>ライブ</span></h1>
    <p id="sub">第22回 さつま町駅伝競走大会</p>
  </div>
  <div class="clock">
    <span id="status" class="pill">接続中</span>
    <div><small id="clockLabel">経過</small><b id="clock">--:--</b></div>
  </div>
</header>

<main class="layout">
  <section class="mapwrap">
    <div id="map" aria-label="コース地図"></div>
    <button id="fitBtn" class="mapbtn" type="button">コース全体</button>
  </section>

  <aside class="panel">
    <div id="demoBar" class="demo" hidden>
      <p><b>デモ表示中</b>（本番のデータではありません）</p>
      <div class="speeds">
        <button type="button" data-speed="1">等速</button>
        <button type="button" data-speed="10">10倍</button>
        <button type="button" data-speed="30">30倍</button>
        <button type="button" id="restartBtn">最初から</button>
      </div>
    </div>

    <h2>順位</h2>
    <ol id="standings" class="standings"></ol>
    <p id="empty" class="empty" hidden>まだ位置データが届いていません。スタートまでお待ちください。</p>

    <details class="legs">
      <summary>区間表（全13区間・18.29km）</summary>
      <table>
        <thead><tr><th>区</th><th>中継所まで</th><th>走者</th><th>km</th><th>予定</th></tr></thead>
        <tbody id="legTable"></tbody>
      </table>
    </details>
    <p class="note">位置はタスキに付けたスマホのGPSです。電波や地形で数十mずれることがあります。<br>地図：国土地理院</p>
  </aside>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
